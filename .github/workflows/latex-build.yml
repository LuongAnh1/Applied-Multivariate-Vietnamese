name: Build LaTeX PDFs

on:
  pull_request:
    branches:
      - main
    paths:
      - "translation/**/*.tex"
      - "translation/figures/**"
      - "slides/**/*.tex"
      - "slides/**/*.sty"
      - "slides/figures/**"
      - "slides/images/**"
      - ".github/workflows/latex-build.yml"
  push:
    branches:
      - main
    paths:
      - "translation/**/*.tex"
      - "translation/figures/**"
      - "slides/**/*.tex"
      - "slides/**/*.sty"
      - "slides/figures/**"
      - "slides/images/**"
      - ".github/workflows/latex-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: translation
            working_directory: translation
            artifact_name: translation-pdf
          - name: slides
            working_directory: slides
            artifact_name: slides-pdf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: ${{ matrix.working_directory }}
          root_file: main.tex
          latexmk_use_xelatex: true
          args: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Check PDF output exists
        run: |
          test -s "${{ matrix.working_directory }}/main.pdf"

      - name: Fail on serious LaTeX log issues
        run: |
          test -s "${{ matrix.working_directory }}/main.log"

          patterns="(^!|LaTeX Error|Package .* Error|Undefined control sequence|Missing \$ inserted|Extra }, or forgotten \$|Misplaced alignment tab character|Double subscript|Double superscript|Display math should end with|Overfull \\hbox|There were undefined references|Rerun to get cross-references right)"

          if grep -nE "$patterns" "${{ matrix.working_directory }}/main.log"; then
            echo "::error::LaTeX log contains errors or serious warnings. Fix them before merging."
            exit 1
          fi

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.working_directory }}/main.pdf
